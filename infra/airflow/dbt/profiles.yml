# dbt connection profile for Airflow containers (POSTGRES_HOST=postgres on Docker network).
fintech_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'fintech') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'fintech_dev_change_me') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'fintech') }}"
      schema: analytics_dev
      threads: 4
