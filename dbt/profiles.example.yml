# Copy to profiles.yml and adjust, or rely on env vars (see .env.example).
# Run: dbt debug --project-dir dbt --profiles-dir dbt

fintech_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'fintech') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'fintech_dev_change_me') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'fintech') }}"
      schema: analytics_dev
      threads: 4
