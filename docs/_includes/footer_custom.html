<div class="site-end">
  <div class="site-end__brand">
    <strong>{{ site.author.name | default: site.author_name | default: site.title }}</strong>
    <span>{{ site.tagline }}</span>
  </div>
  <nav class="site-end__links" aria-label="Footer">
    {% if site.linkedin_url and site.linkedin_url != "" %}
      <a href="{{ site.linkedin_url }}">LinkedIn</a>
    {% endif %}
    <a href="{{ site.github_url }}">GitHub</a>
    <a href="{{ site.cv_path | default: '/cv/' | relative_url }}">CV</a>
    {% if site.email and site.email != "" %}
      <a href="mailto:{{ site.email }}">Email</a>
    {% endif %}
  </nav>
  <p class="site-end__copy">&copy; {{ 'now' | date: '%Y' }}</p>
</div>
