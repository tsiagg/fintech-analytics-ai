# GitHub Pages config. The site is served from this /docs folder on the main branch.
# Settings -> Pages -> Source: Deploy from a branch -> Branch: main, Folder: /docs

title: Fintech Analytics AI
description: >-
  An analytics engineering portfolio: dbt marts, a MetricFlow semantic layer,
  Airflow orchestration, and a guardrailed AI BI layer on a simulated fintech warehouse.

url: https://tsiagg.github.io
baseurl: /fintech-analytics-ai

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  # Rewrites relative .md links to their built .html paths, so cross-page links
  # work both on github.com and on the published site.
  - jekyll-relative-links

search_enabled: true
heading_anchors: true

aux_links:
  View on GitHub:
    - https://github.com/tsiagg/fintech-analytics-ai

# Every page uses the theme layout unless it overrides it.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Internal notes that live in docs/ but should not become pages.
# cfo_report_latest.html is deliberately NOT excluded: the site links to it as a
# real generated artifact.
exclude:
  - assets/screenshots/CAPTURE-GUIDE.md
